<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" preserveAspectRatio="xMidYMax slice">
  <!-- PLACEHOLDER SCENERY — Island room wall. Sky/sun/ocean/palm trees
       instead of a flat recolor. Swap for your own art any time; it's
       rendered via CSS background-image (background-size: cover), so any
       roughly-landscape image drops in without code changes. -->
  <defs>
    <linearGradient id="islandSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FCBDC"/>
      <stop offset="100%" stop-color="#EAF7F3"/>
    </linearGradient>
    <linearGradient id="islandSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FC2CC"/>
      <stop offset="100%" stop-color="#5FA9B4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="200" fill="url(#islandSky)"/>

  <!-- sun -->
  <circle cx="390" cy="46" r="26" fill="#F6D488" opacity="0.9"/>
  <circle cx="390" cy="46" r="38" fill="#F6D488" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="90" cy="40" rx="26" ry="10"/>
    <ellipse cx="112" cy="34" rx="20" ry="9"/>
    <ellipse cx="250" cy="26" rx="20" ry="8"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#4A4038" stroke-width="2" stroke-linecap="round">
    <path d="M150 55 q6 -8 12 0 q6 -8 12 0"/>
    <path d="M190 40 q5 -6 10 0 q5 -6 10 0"/>
  </g>

  <!-- ocean -->
  <rect x="0" y="128" width="480" height="72" fill="url(#islandSea)"/>
  <path d="M0 128 L480 128" stroke="#5FA9B4" stroke-width="2"/>
  <g fill="none" stroke="#EAF7F3" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <path d="M20 150 q20 8 40 0 q20 -8 40 0 q20 8 40 0"/>
    <path d="M260 168 q20 8 40 0 q20 -8 40 0 q20 8 40 0"/>
    <path d="M0 185 q20 8 40 0 q20 -8 40 0 q20 8 40 0 q20 -8 40 0 q20 8 40 0"/>
  </g>

  <!-- palm tree, left -->
  <g>
    <path d="M46 200 C40 160 60 140 50 108" fill="none" stroke="#8A6A4A" stroke-width="7" stroke-linecap="round"/>
    <g fill="#7FA968">
      <path d="M50 108 C20 96 6 106 0 122 C24 118 40 114 50 108 Z"/>
      <path d="M50 108 C26 84 8 86 -2 98 C18 104 38 108 50 108 Z"/>
      <path d="M50 108 C52 78 68 66 84 66 C74 88 62 102 50 108 Z"/>
      <path d="M50 108 C64 88 82 86 94 96 C76 106 60 110 50 108 Z"/>
    </g>
  </g>

  <!-- palm tree, right -->
  <g>
    <path d="M440 200 C448 168 430 150 442 122" fill="none" stroke="#8A6A4A" stroke-width="6" stroke-linecap="round"/>
    <g fill="#6E9C63">
      <path d="M442 122 C466 110 480 118 486 132 C464 130 450 126 442 122 Z"/>
      <path d="M442 122 C462 100 478 102 488 112 C470 118 452 122 442 122 Z"/>
      <path d="M442 122 C438 96 424 86 410 86 C420 104 432 116 442 122 Z"/>
      <path d="M442 122 C426 106 410 106 400 116 C416 124 430 126 442 122 Z"/>
    </g>
  </g>
</svg>
