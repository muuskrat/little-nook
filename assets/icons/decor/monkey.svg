<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <!-- PLACEHOLDER ICON — Monkey pet. Full-body figure on the character's
       own 220x320 canvas (see assets/character/parts/body/regular/base.svg)
       rather than a small square head-only icon, so it actually reads as
       "the same size as the character" (see MONKEY_ASPECT_RATIO in
       js/room.js) instead of a shrunken, letterboxed icon. Special: this
       one moves around the room on its own and drops bananas — see
       monkeyTick() in js/main.js — rather than sitting still like every
       other decoration. -->
  <g fill="none" stroke="#4A4038" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M78 150 C64 175 60 210 66 245 C72 275 88 292 110 292 C132 292 148 275 154 245 C160 210 156 175 142 150 Z" fill="#B98A5E" opacity="0.35"/>
    <!-- tail -->
    <path d="M150 240 C195 245 210 205 200 165 C193 135 165 122 156 138" stroke-width="5"/>
    <!-- arms -->
    <path d="M80 158 C55 185 46 225 52 260"/>
    <path d="M140 158 C165 185 174 225 168 260"/>
    <circle cx="52" cy="263" r="11"/>
    <circle cx="168" cy="263" r="11"/>
    <!-- legs -->
    <path d="M92 285 L86 312"/>
    <path d="M128 285 L134 312"/>
    <ellipse cx="82" cy="315" rx="16" ry="8"/>
    <ellipse cx="138" cy="315" rx="16" ry="8"/>
    <!-- head + ears -->
    <circle cx="52" cy="92" r="24"/>
    <circle cx="168" cy="92" r="24"/>
    <circle cx="110" cy="100" r="48"/>
    <ellipse cx="110" cy="108" rx="34" ry="30" fill="#EFE0C8" opacity="0.7"/>
    <circle cx="94" cy="102" r="4.5" fill="#4A4038"/>
    <circle cx="126" cy="102" r="4.5" fill="#4A4038"/>
    <path d="M94 128 Q110 138 126 128"/>
  </g>
</svg>
