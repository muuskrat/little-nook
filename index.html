<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Nook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">

    <!-- TOP BAR: meters + money -->
    <header id="topbar">
      <div id="meters">
        <div class="meter" data-stat="food" title="Food — how full your pet is">
          <img class="meter-icon" src="assets/icons/meters/food.svg" alt="Food">
          <div class="meter-track"><div class="meter-fill" id="fill-food"></div></div>
        </div>
        <div class="meter" data-stat="water" title="Water — how hydrated your pet is">
          <img class="meter-icon" src="assets/icons/meters/water.svg" alt="Water">
          <div class="meter-track"><div class="meter-fill" id="fill-water"></div></div>
        </div>
        <div class="meter" data-stat="sleep" title="Sleep — how rested your pet is">
          <img class="meter-icon" src="assets/icons/meters/sleep.svg" alt="Sleep">
          <div class="meter-track"><div class="meter-fill" id="fill-sleep"></div></div>
        </div>
        <div class="meter" data-stat="fun" title="Fun — how entertained your pet is">
          <img class="meter-icon" src="assets/icons/meters/fun.svg" alt="Fun">
          <div class="meter-track"><div class="meter-fill" id="fill-fun"></div></div>
        </div>
        <div class="meter" data-stat="health" title="Health — your pet's overall wellbeing">
          <img class="meter-icon" src="assets/icons/meters/health.svg" alt="Health">
          <div class="meter-track"><div class="meter-fill" id="fill-health"></div></div>
        </div>
        <div class="meter" data-stat="love" title="Love — your bond with your pet">
          <img class="meter-icon" src="assets/icons/meters/love.svg" alt="Love">
          <div class="meter-track"><div class="meter-fill" id="fill-love"></div></div>
        </div>
      </div>
      <!-- current mood, kept in sync by renderMoodDisplay() in js/main.js -->
      <div id="mood-display" title="Current mood">
        <span id="mood-label">😊 Happy</span>
      </div>
      <div id="money-display">
        <span class="coin">🪙</span><span id="money-amount">0</span>
      </div>
    </header>

    <!-- MAIN ROOM VIEW -->
    <main id="room-view">
      <div id="room">
        <div id="room-wall"></div>
        <!-- room-floor is just the background texture (it needs a clip-path
             for the perspective trapezoid look, which would also clip the
             character/items if they lived inside it) -->
        <div id="room-floor"></div>
        <!-- scene-overlay sits on top of both the wall and floor, exactly
             matching the floor's box, but with no clipping — so the pet
             and room items are never cut off near the back wall -->
        <div id="scene-overlay">
          <div id="room-items-layer"></div>
          <div id="pet-wrap">
            <span id="carry-slot" class="outfit-slot"></span>
            <div id="pet-visual">
              <img class="pet-layer" id="layer-body" src="assets/character/parts/body/regular/base.svg" alt="">
              <img class="pet-layer" id="layer-ears" src="assets/character/parts/ears/bunny.svg" alt="">
              <img class="pet-layer" id="layer-head" src="assets/character/parts/head/long.svg" alt="">
              <img class="pet-layer" id="layer-face" src="assets/character/parts/face/face-neutral.svg" alt="your pet">
            </div>
            <!-- only visible while a petting hold session is active — see
                 setPettingVisual() in room.js -->
            <img id="petting-hand" src="assets/icons/interact/pet.svg" alt="">
            <div id="pet-name-tag">Pet</div>
          </div>
        </div>
        <!-- secret dev button: +100 coins, for testing -->
        <button id="btn-dev-coins" title="Dev: +100 coins">🐞</button>
        <!-- appears only while carrying a decor item in Decorate mode -->
        <button id="btn-storage" class="hidden" title="Put away">
          <img src="assets/icons/actions/storage.svg" alt="Put away">
        </button>
        <!-- shown only while actively holding a petting gesture on the
             character (see startPetting() in main.js) -->
        <div id="petting-meter" class="hidden">
          <img class="btn-icon" src="assets/icons/interact/pet.svg" alt="">
          <div class="meter-track"><div class="meter-fill" id="petting-meter-fill"></div></div>
        </div>
        <!-- INTERACT SIDEBAR: styled like the bottom action bar, always
             visible rather than a popup that follows the pet around. Pet/
             Play/Scold no longer fire on click — clicking one arms it (see
             main.js's pendingInteraction) and it only activates once you
             click the character with it armed. -->
        <div id="interact-bar">
          <button class="action-btn" id="btn-pet-action" title="Pet: click to arm, then click-and-hold the character">
            <img class="btn-icon" src="assets/icons/interact/pet.svg" alt=""><span>Pet</span>
            <div class="mini-meter-track" title="Pet energy — refills over time"><div class="mini-meter-fill" id="pet-energy-fill"></div></div>
          </button>
          <button class="action-btn" id="btn-play-action" title="Play: click to arm, then click the character">
            <img class="btn-icon" src="assets/icons/interact/play.svg" alt=""><span>Play</span>
            <div class="mini-meter-track" title="Play energy — refills over time"><div class="mini-meter-fill" id="play-energy-fill"></div></div>
          </button>
          <button class="action-btn" id="btn-exercise-action" title="Exercise: click to arm, then click the character — burns off food">
            <img class="btn-icon" src="assets/icons/interact/exercise.svg" alt=""><span>Exercise</span>
            <div class="mini-meter-track" title="Exercise energy — refills over time"><div class="mini-meter-fill" id="exercise-energy-fill"></div></div>
          </button>
          <button class="action-btn" id="btn-scold-action" title="Scold: click to arm, then click the character">
            <img class="btn-icon" src="assets/icons/interact/scold.svg" alt=""><span>Scold</span>
          </button>
          <button class="action-btn" id="btn-move" title="Move: click the floor to send your pet there"><img class="btn-icon" src="assets/icons/interact/move.svg" alt=""><span>Move</span></button>
        </div>
      </div>
      <div id="speech-bubble" class="hidden"></div>
    </main>

    <!-- BOTTOM ACTION BAR -->
    <nav id="action-bar">
      <button class="action-btn" id="btn-feed" title="Feed"><img class="btn-icon" src="assets/icons/actions/feed.svg" alt=""><span>Feed</span></button>
      <button class="action-btn" id="btn-water" title="Give Water"><img class="btn-icon" src="assets/icons/actions/water.svg" alt=""><span>Water</span></button>
      <button class="action-btn" id="btn-play" title="Play Mini-games"><img class="btn-icon" src="assets/icons/actions/games.svg" alt=""><span>Games</span></button>
      <button class="action-btn" id="btn-shop" title="Shop"><img class="btn-icon" src="assets/icons/actions/shop.svg" alt=""><span>Shop</span></button>
      <button class="action-btn" id="btn-decorate" title="Decorate"><img class="btn-icon" src="assets/icons/actions/decorate.svg" alt=""><span>Decorate</span></button>
    </nav>

  </div>

  <!-- MODAL OVERLAY (shop / minigames / inventory) -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-panel">
      <button id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
